<tr>
    <td colspan="2" style="padding:10px 0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
            style="background:#fff5f4;border:1px solid #f0b8b2;border-radius:14px;">
            <tr>
                <td width="80" valign="top" style="padding:12px 12px 12px 12px;">
                    <img src="{{ITEM_IMAGE_URL}}" width="80" height="80" alt="{{ITEM_NAME}}"
                        style="display:block;border:1px solid #e9aaa4;border-radius:12px;object-fit:cover;"
                        border="0" />
                </td>
                <td valign="top" style="padding:12px 0;font-size:14px;line-height:1.4;color:#5b2f2b;">
                    <strong>{{ITEM_NAME}}</strong><br>
                    <span style="font-size:13px;color:#8d4c45;">{{ITEM_OPTIONS}}</span><br>
                    <span style="font-size:13px;color:#8d4c45;">Amount: {{ITEM_AMOUNT}}</span>
                </td>
                <td width="124" valign="top" align="right" style="width:124px;white-space:nowrap;font-size:14px;color:#8a332d;padding:12px 12px 12px 10px;font-weight:bold;">{{ITEM_PRICE}}</td>
            </tr>
        </table>
    </td>
</tr>

<tr>
    <td colspan="2" style="padding:10px 0;border-bottom:1px solid #e7eee6;">
        <a href="{{ITEM_URL}}" style="text-decoration:none;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td width="80" valign="top" style="padding-right:12px;">
                        <img src="{{ITEM_IMAGE_URL}}" width="80" height="80" alt="{{ITEM_NAME}}"
                            style="display:block;border:1px solid #d9e3d8;border-radius:12px;object-fit:cover;"
                            border="0" />
                    </td>
                    <td valign="top" style="font-size:14px;line-height:1.4;color:#252435;">
                        <strong>{{ITEM_NAME}}</strong><br>
                        <span style="font-size:13px;color:#464860;">Category: {{ITEM_CATEGORY}}</span>
                    </td>
                    <td width="124" valign="top" align="right"
                        style="width:124px;white-space:nowrap;font-size:16px;color:#252435;padding-left:10px;font-weight:bold;">
                        <span style="color:#464760;">{{ITEM_PRICE}}</span><br>
                        <span
                            style="text-decoration:line-through;color:#9191c0;font-size:14px;">{{OLD_PRICE}}</span><br><br>
                        <span
                            style="font-size:16px;background-color:#efd0a9;color:#21150f;border:1px solid #bf8250;font-weight:bold;padding: 5px;border-radius: 9999px;">{{ITEM_DISCOUNT}}</span>
                    </td>
                </tr>
            </table>
        </a>
    </td>
</tr>
